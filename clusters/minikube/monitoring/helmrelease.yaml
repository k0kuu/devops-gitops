apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring                   
  namespace: flux-system             
spec:
  interval: 5m
  releaseName: monitoring
  targetNamespace: monitoring        
  chart:
    spec:
      chart: kube-prometheus-stack   
      version: "92.16.1"             
      sourceRef:
        kind: HelmRepository         
        name: prometheus-community   