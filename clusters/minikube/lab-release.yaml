apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab
  targetNamespace: lab-flux
  chart:
    spec:
      chart: ./charts/devops-lab
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    replicaCount: 3
    appVersion: "e1bec1574ed537b817bcef0c78cd6dfe0be30353"
    image:
      repository: "ghcr.io/k0kuu/devops-lab"
      tag: "e1bec1574ed537b817bcef0c78cd6dfe0be30353"
    serviceMonitor:
      enabled: true
