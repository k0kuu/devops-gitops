apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab
  targetNamespace: lab-flux
  chart:
    spec:
      chart: ./charts/devops-lab
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    appVersion: "9e4797c6aa08f730b8d4077a2541e6d1cbdc3082"
    image:
      repository: "ghcr.io/k0kuu/devops-lab"
      tag: "9e4797c6aa08f730b8d4077a2541e6d1cbdc3082"
    serviceMonitor:
      enabled: true