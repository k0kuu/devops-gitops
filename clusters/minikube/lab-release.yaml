apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab
  targetNamespace: lab-flux
  chart:
    spec:
      chart: ./charts/devops-lab
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    appVersion: "39d86807f2dbfe7d6a012b5aee848e526eff68e7"
    image:
      repository: "ghcr.io/k0kuu/devops-lab"
      tag: "39d86807f2dbfe7d6a012b5aee848e526eff68e7"
    serviceMonitor:
      enabled: true